<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Filtro de resplandor para las altas luces -->
    <filter id="glow-lensing" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente Doppler para la banda ecuatorial horizontal -->
    <linearGradient id="equatorial-doppler" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4800" stop-opacity="0" />
      <stop offset="15%" stop-color="#ff7b00" stop-opacity="0.8" />
      <stop offset="32%" stop-color="#ffc338" stop-opacity="0.95" />
      <stop offset="46%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#fff1c2" stop-opacity="0.98" />
      <stop offset="72%" stop-color="#ff901a" stop-opacity="0.85" />
      <stop offset="88%" stop-color="#ff4800" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c41a00" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente para el filamento blanco de máxima luminosidad -->
    <linearGradient id="white-core-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffaa33" stop-opacity="0" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="65%" stop-color="#ffe8a3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff7700" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente para el arco superior de lente gravitacional -->
    <linearGradient id="top-lensing-arc" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#ffbe42" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#ff6000" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#b82000" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente para el arco inferior -->
    <linearGradient id="bottom-lensing-arc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffb033" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#ff5500" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#991100" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente del anillo de fotones -->
    <linearGradient id="photon-ring-grad" x1="15%" y1="35%" x2="85%" y2="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fff4c7" />
      <stop offset="70%" stop-color="#ffab38" />
      <stop offset="100%" stop-color="#ff5900" />
    </linearGradient>

    <!-- Resplandor esférico de fondo -->
    <radialGradient id="ambient-sphere-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#ff5500" stop-opacity="0.2" />
      <stop offset="75%" stop-color="#ff3300" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. RESPLANDOR AMBIENTAL CÁLIDO (FONDO TRANSPARENTE) -->
  <circle cx="64" cy="64" r="58" fill="url(#ambient-sphere-glow)" />

  <!-- 2. ARCO GRAVITACIONAL SUPERIOR (Lente de Einstein superior) -->
  <g filter="url(#glow-lensing)">
    <!-- Cuerpo ancho del arco superior -->
    <path d="M 16 63 C 20 32, 40 14, 64 14 C 88 14, 108 32, 112 63 C 103 36, 85 24, 64 24 C 43 24, 25 36, 16 63 Z" 
          fill="url(#top-lensing-arc)" opacity="0.85" />

    <!-- Filamento fino hiperbrillante superior -->
    <path d="M 23 63 C 28 38, 44 24, 64 24 C 84 24, 100 38, 105 63" 
          fill="none" stroke="#ffe699" stroke-width="2.6" opacity="0.8" />
    <path d="M 24 63 C 29 39, 44 25, 64 25 C 84 25, 99 39, 104 63" 
          fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.95" />
  </g>

  <!-- 3. ARCO GRAVITACIONAL INFERIOR (Lente de Einstein inferior) -->
  <g filter="url(#glow-lensing)">
    <path d="M 19 65 C 25 86, 42 102, 64 102 C 86 102, 103 86, 109 65 C 100 82, 83 93, 64 93 C 45 93, 28 82, 19 65 Z" 
          fill="url(#bottom-lensing-arc)" opacity="0.75" />
    <path d="M 23 65 C 31 83, 46 94, 64 94 C 82 94, 97 83, 105 65" 
          fill="none" stroke="#ffe599" stroke-width="1.8" opacity="0.85" />
    <path d="M 25 65 C 32 84, 46 95, 64 95 C 82 95, 96 84, 103 65" 
          fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.95" />
  </g>

  <!-- 4. HORIZONTE DE SUCESOS (Sombra circular central de negro absoluto #000000) -->
  <circle cx="64" cy="64" r="26.5" fill="#000000" />

  <!-- 5. ANILLO DE FOTONES (Photon Ring: Círculo fino blanco/oro que abraza el borde del agujero) -->
  <circle cx="64" cy="64" r="26.5" 
          fill="none" 
          stroke="url(#photon-ring-grad)" 
          stroke-width="1.8" 
          filter="url(#soft-glow)" />
  <circle cx="64" cy="64" r="26.8" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="0.9" 
          opacity="0.95" />

  <!-- 6. DISCO DE ACRECIÓN ECUATORIAL (Cruza horizontalmente por delante) -->
  <g filter="url(#glow-lensing)">
    <!-- Base difusa del disco -->
    <path d="M 4 64 C 20 58.5, 44 60.5, 64 61.5 C 84 62.5, 108 60.5, 124 64 C 108 69.5, 84 67.5, 64 66.5 C 44 65.5, 20 69.5, 4 64 Z" 
          fill="url(#equatorial-doppler)" />

    <!-- Franja de mayor densidad -->
    <path d="M 6 64 C 22 61, 44 62, 64 62.8 C 84 63.5, 106 62, 122 64 C 106 66.8, 84 65.8, 64 65.2 C 44 64.5, 22 66.8, 6 64 Z" 
          fill="url(#equatorial-doppler)" />

    <!-- Filamento blanco hiperbrillante (Doppler: más grueso y luminoso a la izquierda) -->
    <path d="M 10 64 C 26 62.5, 45 63, 64 63.5 C 83 64, 102 63, 118 64" 
          fill="none" 
          stroke="url(#white-core-line)" 
          stroke-width="2.2" 
          stroke-linecap="round" />

    <path d="M 16 64 C 30 63, 46 63.2, 64 63.6 C 80 64, 96 63.4, 112 64" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1.2" 
          stroke-linecap="round" />
  </g>

  <!-- 7. REALCE DOPPLER EN EL LADO IZQUIERDO -->
  <ellipse cx="44" cy="63.5" rx="15" ry="2.2" fill="#ffffff" opacity="0.88" filter="url(#soft-glow)" />
</svg>
